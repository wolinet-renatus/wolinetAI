# ==============================================================================
# Wolinet AI — Nginx Global Configuration
# Covers: performance tuning, TLS defaults, upstream pools, global headers
# ==============================================================================

user nginx;
worker_processes auto;                  # 1 worker per CPU core
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"ssl_protocol":"$ssl_protocol",'
            '"host":"$host"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  600s;
    keepalive_requests 10000;
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout       600s;
    types_hash_max_size 2048;
    client_max_body_size 256M;          # allow large file uploads (RAG docs)
    server_tokens      off;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    # ── Cloudflare real IP & connection mapping ───────────────────────────────
    map $http_cf_connecting_ip $real_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';                     # Empty preserves HTTP/1.1 keep-alive to upstreams
    }

    # ── Global proxy settings ─────────────────────────────────────────────────
    proxy_http_version          1.1;
    proxy_buffering             off;    # essential for SSE / streaming
    proxy_cache_bypass          $http_upgrade;
    proxy_connect_timeout       60s;
    proxy_send_timeout          600s;
    proxy_read_timeout          600s;   # long AI generation requests
    proxy_socket_keepalive      on;     # active TCP keepalive probes for quiet connections
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $real_client_ip;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
    proxy_set_header CF-Ray             $http_cf_ray;

    # WebSocket / SSE streaming support + persistent upstream keep-alive
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── Global security headers ────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=auth_limit:5m  rate=10r/m;

    # ── TLS shared settings ───────────────────────────────────────────────────
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache           shared:SSL:20m;
    ssl_session_timeout         1d;
    ssl_session_tickets         off;
    ssl_stapling                on;
    ssl_stapling_verify         on;
    resolver                    127.0.0.11 valid=5s ipv6=off;
    resolver_timeout            2s;

    # ── HSTS ──────────────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Include per-subdomain server blocks ───────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
