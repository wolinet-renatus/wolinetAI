# ==============================================================================
# Wolinet AI — Edge Nginx Reverse Proxy Configuration (Cloudflare Edge Aligned)
# Subdomains:
#   1. ai.wolinet.com       → Marketing Website & App Store Links (website:8080)
#   2. wolinex.wolinet.com  → Open WebUI Web Client Studio (wolinex:8080)
#   3. lango.wolinet.com    → LiteLLM AI Gateway & OpenAI API (lango:4000)
#   4. mitambo.wolinet.com  → Xinference Model Inference Engine (mitambo:9997)
#   5. dev.wolinet.com      → Developer Docs & Key Management Portal (devportal:8080)
# ==============================================================================

# Default catch-all for unmatched HTTP requests
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# ── HTTP to HTTPS Redirections (with ACME challenge support) ──────────────────

server {
    listen 80;
    listen [::]:80;
    server_name ai.wolinet.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name wolinex.wolinet.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lango.wolinet.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mitambo.wolinet.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.wolinet.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 1. ai.wolinet.com — Marketing Homepage & Main Website
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.wolinet.com;

    set $website_upstream website:8080;

    ssl_certificate     /etc/nginx/certs/ai.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ai.wolinet.com/privkey.pem;

    location / {
        proxy_pass http://$website_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ==============================================================================
# 2. wolinex.wolinet.com — WebUI Web Client Container
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wolinex.wolinet.com;

    set $wolinex_upstream wolinex:8080;

    ssl_certificate     /etc/nginx/certs/wolinex.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wolinex.wolinet.com/privkey.pem;

    # Wildcard Cookie Session Security (SSO for .wolinet.com) with explicit Secure flag
    proxy_cookie_domain wolinex.wolinet.com .wolinet.com;
    proxy_cookie_path / "/; Domain=.wolinet.com; Secure; SameSite=Lax";
    proxy_cookie_flags ~ secure httponly samesite=lax;

    # WebSockets / Real-time events
    location ^~ /socket.io/ {
        proxy_pass http://$wolinex_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Cloudflare Edge Alignment: suppress edge response buffering
        add_header X-Accel-Buffering no always;
    }

    # Streaming Chat Completions / Model Generation SSE
    location ~* ^/(api/v1/chat|api/chat) {
        proxy_pass http://$wolinex_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Cloudflare Edge Alignment: suppress edge response buffering
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://$wolinex_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Cloudflare Edge Alignment: suppress edge response buffering
        add_header X-Accel-Buffering no always;
    }
}

# ==============================================================================
# 3. lango.wolinet.com — LiteLLM AI Gateway
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lango.wolinet.com;

    set $lango_upstream lango:4000;

    ssl_certificate     /etc/nginx/certs/lango.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lango.wolinet.com/privkey.pem;

    # Wildcard Cookie Session Security (SSO for .wolinet.com) with explicit Secure flag
    proxy_cookie_domain lango.wolinet.com .wolinet.com;
    proxy_cookie_path / "/; Domain=.wolinet.com; Secure; SameSite=Lax";
    proxy_cookie_flags ~ secure httponly samesite=lax;

    # Real-time streaming endpoints (OpenAI /v1/chat/completions, completions, embeddings)
    location ~* ^/v1/(chat/completions|completions|embeddings|models) {
        # CORS Preflight handling for external modules & IDE scripts
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control, X-OpenWebUI-User-Id, X-OpenWebUI-User-Email, X-OpenWebUI-User-Name' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://$lango_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Strict streaming parameters for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Cloudflare Edge Alignment: force Cloudflare to disable edge token buffering
        add_header X-Accel-Buffering no always;

        # CORS Headers on actual responses
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control, X-OpenWebUI-User-Id, X-OpenWebUI-User-Email, X-OpenWebUI-User-Name' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    }

    location / {
        # CORS Preflight handling
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control, X-OpenWebUI-User-Id, X-OpenWebUI-User-Email, X-OpenWebUI-User-Name' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://$lango_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Cloudflare Edge Alignment: force Cloudflare to disable edge token buffering
        add_header X-Accel-Buffering no always;

        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, User-Agent, Cache-Control, X-OpenWebUI-User-Id, X-OpenWebUI-User-Email, X-OpenWebUI-User-Name' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    }
}

# ==============================================================================
# 4. mitambo.wolinet.com — Xinference Local Inference Engine
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mitambo.wolinet.com;

    set $mitambo_upstream mitambo:9997;

