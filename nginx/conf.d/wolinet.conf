# ==============================================================================
# 1. ai.wolinet.com — Marketing Homepage & Main Website
# ==============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ai.wolinet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.wolinet.com;

    ssl_certificate     /etc/nginx/certs/ai.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ai.wolinet.com/privkey.pem;

    # Health probe endpoint for docker/load-balancer
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://website:80;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Cache static marketing assets aggressively
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}


# ==============================================================================
# 2. wolinex.wolinet.com — Open WebUI / Wolinet AI Chat Client
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wolinex.wolinet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wolinex.wolinet.com;
    keepalive_timeout 600s;

    ssl_certificate     /etc/nginx/certs/wolinex.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wolinex.wolinet.com/privkey.pem;

    # ── SSO Cookie: set domain to .wolinet.com for cross-subdomain sharing ──
    # Any cookie with SameSite=None + Secure and Domain=.wolinet.com will be
    # forwarded to dev.wolinet.com automatically by the browser.
    proxy_cookie_domain wolinex.wolinet.com .wolinet.com;
    proxy_cookie_flags  ~ secure samesite=none;

    # ── Auth rate-limit (sign-in / sign-up endpoints) ───────────────────────
    location ~* ^/(api/v1/auths|auth) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://wolinex:8080;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
    }

    # ── Socket.IO + WebSocket real-time channel ───────────────────────────────
    location /socket.io/ {
        proxy_pass         http://wolinex:8080/socket.io/;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 3600s;           # keep WS alive for 1h
    }

    # ── SSE / streaming completions ────────────────────────────────────────────
    location ~* ^/api/v1/chat {
        proxy_pass          http://wolinex:8080;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  600s;
        proxy_socket_keepalive on;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         $connection_upgrade;
        add_header          X-Accel-Buffering  no always;
    }

    # ── Everything else ────────────────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://wolinex:8080;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}


# ==============================================================================
# 3. lango.wolinet.com — LiteLLM Gateway (API + Admin)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name lango.wolinet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lango.wolinet.com;
    keepalive_timeout 600s;

    ssl_certificate     /etc/nginx/certs/lango.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lango.wolinet.com/privkey.pem;

    # ── LiteLLM Streaming (SSE) ────────────────────────────────────────────────
    location ~* ^/(v1/chat/completions|v1/completions|v1/embeddings) {
        proxy_pass         http://lango:4000;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_socket_keepalive on;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         $connection_upgrade;
        add_header         X-Accel-Buffering  no always;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://lango:4000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}


