    ssl_certificate_key /etc/nginx/certs/mitambo.wolinet.com/privkey.pem;

    auth_basic           "Wolinet inference administration";
    auth_basic_user_file /etc/nginx/secrets/mitambo.htpasswd;

    location / {
        proxy_pass http://$mitambo_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
