# ==============================================================================
# 5. dev.wolinet.com — Developer Portal (served by lango / wolinet_portal.py)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dev.wolinet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.wolinet.com;

    ssl_certificate     /etc/nginx/certs/dev.wolinet.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dev.wolinet.com/privkey.pem;

    # ── SSO Cookie forwarding — same domain as wolinex ────────────────────────
    # Cookies set on .wolinet.com are sent here automatically by the browser.
    proxy_cookie_domain dev.wolinet.com .wolinet.com;
    proxy_cookie_flags  ~ secure samesite=none;

    # ── Auth endpoints ─────────────────────────────────────────────────────────
    location ~* ^/portal/(login|register|logout) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass          http://lango:4000;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    # ── Portal API (key generation, user info, spend) ─────────────────────────
    location ~* ^/portal/api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass          http://lango:4000;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
    }

    # ── Scalar / Swagger docs streaming (SSE spec loading) ───────────────────
    location ~* ^/(openapi\.json|swagger/) {
        proxy_pass         http://lango:4000;
        proxy_buffering    off;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }

    # ── Chat assistant widget (SSE completions on dev portal) ────────────────
    location ~* ^/v1/chat/completions {
        proxy_pass         http://lango:4000;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         $connection_upgrade;
        add_header         X-Accel-Buffering  no;
    }

    location / {
        proxy_pass http://lango:4000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
