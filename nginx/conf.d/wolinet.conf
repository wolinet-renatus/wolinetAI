    # Uncomment and adjust to your server IP range for production hardening:
    # allow  YOUR_ADMIN_IP;
    # deny   all;

    # ── Streaming model outputs ───────────────────────────────────────────────
    location ~* ^/v1/(chat/completions|completions|embeddings) {
        proxy_pass         http://mitambo:9997;
        proxy_buffering    off;
