name: Wolinet deployment

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deployment contract tests
        run: python -m unittest discover -s tests -v
      - name: Check browser scripts
        run: |
          node --check apps/homepage/app.js
          node --check website/app.js
          node --check apps/dev-portal/app.js
          python -m compileall -q tests/deployment
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/deploy.yml")'
      - name: Validate Compose configurations
        run: |
          cp .env.prod.example .env
          docker compose --project-name wolinet --file docker-compose.prod.yml config --quiet
          docker compose --project-name wolinet --file docker-compose.prod.yml --file docker-compose.gpu.yml config --quiet
      - name: Validate the Nginx edge configuration
        run: |
          cert_dir="$(mktemp -d)"
          secret_dir="$(mktemp -d)"
          for domain in ai wolinex lango mitambo dev; do
            mkdir -p "${cert_dir}/${domain}.wolinet.com"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout "${cert_dir}/${domain}.wolinet.com/privkey.pem" \
              -out "${cert_dir}/${domain}.wolinet.com/fullchain.pem" \
              -subj "/CN=${domain}.wolinet.com" >/dev/null 2>&1
          done
          hash="$(printf '%s' 'ci-only-password-0123456789' | openssl passwd -6 -stdin)"
          printf 'ci-operator:%s\n' "$hash" > "${secret_dir}/mitambo.htpasswd"
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "${cert_dir}:/etc/nginx/certs:ro" \
            -v "${secret_dir}/mitambo.htpasswd:/etc/nginx/secrets/mitambo.htpasswd:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$PWD/apps/dev-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$PWD/apps/homepage/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$PWD/website/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wolinet-homepage
            context: website
            dockerfile: website/Dockerfile
          - image: wolinet-devportal
            context: apps/dev-portal
            dockerfile: apps/dev-portal/Dockerfile
          - image: wolinet-lango
            context: gateway
            dockerfile: gateway/Dockerfile
          - image: wolinet-wolinex
            context: apps/web-client
            dockerfile: apps/web-client/Dockerfile
          - image: wolinet-mitambo
            context: inference
            dockerfile: inference/xinference/deploy/docker/Dockerfile
          - image: wolinet-mitambo-cpu
            context: inference
            dockerfile: inference/xinference/deploy/docker/Dockerfile.cpu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image }}"
          tags="${image}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then tags="${tags},${image}:latest"; fi
          if [ "${GITHUB_REF_NAME}" = "production" ]; then tags="${tags},${image}:production"; fi
          echo "value=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ai.wolinet.com
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_KEY }}
      - name: Add server host key
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: ssh-keyscan -H "$CONTABO_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Copy runtime configuration
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
        run: |
          ssh "${CONTABO_USER}@${CONTABO_HOST}" "mkdir -p /opt/wolinetai"
          rsync -avzR \
            ./docker-compose.prod.yml \
            ./docker-compose.gpu.yml \
            ./gateway/config.yaml \
            ./gateway/start-gateway.sh \
            ./gateway/assets \
            ./gateway/litellm/proxy/swagger \
            ./scripts/deploy/sync_xinference_models.py \
            ./scripts/deploy/ensure-postgres-databases.sh \
            ./nginx/nginx.conf \
            ./nginx/conf.d \
            ./scripts/deploy_production.sh \
            ./scripts/setup_mitambo_auth.sh \
            ./scripts/renew_tls.sh \
            ./scripts/db/init-postgres.sh \
            ./scripts/db/migrations \
            "${CONTABO_USER}@${CONTABO_HOST}:/opt/wolinetai/"
      - name: Authenticate registry and roll out release
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh "${CONTABO_USER}@${CONTABO_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"
          ssh "${CONTABO_USER}@${CONTABO_HOST}" \
            "cd /opt/wolinetai && chmod +x scripts/deploy_production.sh && ./scripts/deploy_production.sh sha-${GITHUB_SHA}"
      - name: Verify public services
        run: |
          for url in \
            https://ai.wolinet.com/healthz \
            https://wolinex.wolinet.com/health \
            https://lango.wolinet.com/health \
            https://dev.wolinet.com/healthz; do
            curl --fail --silent --show-error --retry 10 --retry-delay 3 "$url" >/dev/null
          done
