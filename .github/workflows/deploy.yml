name: Wolinet AI — CI/CD Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 1: Lint & Static Analysis
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "🔍 Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy types-requests

      - name: Ruff lint (gateway)
        run: ruff check gateway/litellm/proxy/ --select E,W,F,I --ignore E501
        continue-on-error: false

      - name: Ruff lint (webui backend)
        run: ruff check apps/web-client/backend/open_webui/ --select E,W,F,I --ignore E501
        continue-on-error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-client/package-lock.json

      - name: Install WebUI frontend deps
        working-directory: apps/web-client
        run: npm ci --prefer-offline

      - name: ESLint WebUI frontend
        working-directory: apps/web-client
        run: npm run lint -- --max-warnings 0
        continue-on-error: true

      - name: Svelte-check type validation
        working-directory: apps/web-client
        run: npx svelte-check --tsconfig ./tsconfig.json
        continue-on-error: true

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 2: Automated Tests
# ──────────────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: litellm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install gateway deps
        working-directory: gateway
        run: pip install -e ".[proxy]" psycopg pytest pytest-asyncio httpx

      - name: Run gateway unit tests
        working-directory: gateway
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/litellm_test
          LITELLM_MASTER_KEY: sk-test-ci-key
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -x -q --timeout=60 || true

      - name: Init test webui DB
        run: psql postgresql://postgres:test_password@localhost:5432/litellm_test -f scripts/db/migrations/01_litellm_core.sql
        continue-on-error: true

      - name: Install webui backend deps
        working-directory: apps/web-client/backend
        run: pip install -r requirements.txt psycopg pytest pytest-asyncio

      - name: Run webui backend tests
        working-directory: apps/web-client/backend
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/litellm_test
          WEBUI_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/litellm_test
          REDIS_URL: redis://localhost:6379
          LITELLM_MASTER_KEY: sk-test-ci-key
          WEBUI_SECRET_KEY: test-secret
        run: pytest open_webui/ -x -q --timeout=60 -k "not integration" || true

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 3: Build & Push Docker Images
# ──────────────────────────────────────────────────────────────────────────────
  build-wolinex:
    name: "🐳 Build wolinex (Open WebUI)"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/wolinex
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push wolinex image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-client
          file: ./apps/web-client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

# ──────────────────────────────────────────────────────────────────────────────
# STAGE 4: Rolling Deploy to Contabo Production Server
# ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Rolling Deploy → Contabo"
    runs-on: ubuntu-latest
    needs: [build-wolinex]
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://ai.wolinet.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.CONTABO_HOST }} >> ~/.ssh/known_hosts

      - name: Copy updated configs to server
        run: |
          rsync -avz --checksum \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'models/' \
            docker-compose.prod.yml \
            gateway/config.yaml \
            nginx/ \
            scripts/db/ \
            ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}:/opt/wolinetai/

      - name: Pull latest images & rolling restart
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
        run: |
          ssh ${{ env.CONTABO_USER }}@${{ env.CONTABO_HOST }} << 'REMOTE_EOF'
            set -euo pipefail
            cd /opt/wolinetai

            echo "==> Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull lango wolinex nginx

            echo "==> Running DB migrations (idempotent)..."
            docker compose -f docker-compose.prod.yml exec -T postgres \
              psql -U postgres -d litellm -f /docker-entrypoint-initdb.d/00-init.sh || true

            echo "==> Rolling restart: lango (gateway)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate lango
            sleep 10
            docker compose -f docker-compose.prod.yml ps lango | grep -q "healthy\|running"

            echo "==> Rolling restart: wolinex (webui)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate wolinex
            sleep 15
            docker compose -f docker-compose.prod.yml ps wolinex | grep -q "healthy\|running"

            echo "==> Reloading nginx (zero-downtime)..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            echo "==> Pruning old images..."
            docker image prune -f --filter "until=24h"

            echo "==> Deploy complete. Stack status:"
            docker compose -f docker-compose.prod.yml ps
          REMOTE_EOF

      - name: Health check
        run: |
          sleep 10
          curl -sf https://ai.wolinet.com/nginx-health      || echo "website check failed"
          curl -sf https://wolinex.wolinet.com/health        || echo "wolinex check failed"
          curl -sf https://lango.wolinet.com/health          || echo "lango check failed"
          curl -sf https://dev.wolinet.com/nginx-health      || echo "dev portal check failed"
          echo "Post-deploy health checks complete."
