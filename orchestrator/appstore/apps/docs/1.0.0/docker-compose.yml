services:
  docs:
    image: ghcr.io/wolinet-renatus/wolinet-docs:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - ${PANEL_APP_PORT_HTTP}:8083
    environment:
      - LANGO_UPSTREAM=${LANGO_API_BASE_URL}
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

