services:
  lango:
    image: ghcr.io/wolinet-renatus/wolinet-lango:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - ${PANEL_APP_PORT_HTTP}:4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - WOLINET_GATEWAY_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - STORE_MODEL_IN_DB=true
    volumes:
      - ./data:/app/data
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
