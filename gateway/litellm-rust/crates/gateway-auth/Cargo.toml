[package]
name = "litellm-gateway-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
deadpool-postgres = "0.14"
litellm-auth-types.workspace = true
litellm-config.workspace = true
litellm-cost = { path = "../cost" }
litellm-model-catalog = { path = "../model-catalog" }
litellm-secrets.workspace = true
moka.workspace = true
redis = { version = "0.27", default-features = false, features = ["aio", "connection-manager", "tokio-comp", "tokio-rustls-comp"] }
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
rstest.workspace = true
tokio.workspace = true
tower = { version = "0.5.3", features = ["util"] }
