general_settings:
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 60     # max PG connections from lango (increased for high concurrency)
  database_connection_timeout: 60        # seconds before pool acquisition fails
  user_api_key_cache_ttl: 300            # cache resolved API keys in memory for 5 minutes (eliminates redundant DB queries)
  forward_client_headers_to_llm_api: true
  forward_llm_provider_auth_headers: true
  master_key: os.environ/LITELLM_MASTER_KEY
  pass_through_endpoints:
  - path: /v1/rerank
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /rerank
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/ocr
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/doc_analyze
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/defense/inspect
    target: "http://host.docker.internal:8088"
  - path: /defense/inspect
    target: "http://host.docker.internal:8088"
  - path: /v1/audio/voices
    target: "http://127.0.0.1:8090/v1/audio/voices"
  - path: /audio/voices
    target: "http://127.0.0.1:8090/audio/voices"
  store_model_in_db: true
  disable_env_credential_login: true
  hide_default_credentials_hint: true
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: internal_user

