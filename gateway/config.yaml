    - "gpt-4o-mini": ["Wolinet Max", "Wolinet Pro"]
    - "gpt-4": ["Wolinet Max", "Wolinet Pro"]
    - "claude-3-5-sonnet": ["Wolinet Max", "Wolinet Pro"]
  context_window_fallbacks:
