model_list:
  # Wolinex Coder: Ultra-Fast Sovereign Coding & AST Analysis (70+ tok/s, 32k context) - PRIMARY SOVEREIGN MODEL
  - model_name: "Wolinex Coder"
    litellm_params:
      model: "openai/Deepseeker Coder"
      api_base: "http://host.docker.internal:8088/v1"
      api_key: "sk-XvKFiwDoOtOe8i4lwbzb8Q"
      merge_reasoning_content_in_choices: false
    model_info:
      id: "wolinex-coder"
      mode: chat
      base_model: "Wolinex Coder"
      max_input_tokens: 32768
      max_output_tokens: 8192
      rpm: 3000
      tpm: 6000000

  # Wolinet Pro: Sovereign Autonomous Agent Core
  - model_name: "Wolinet Pro"
    litellm_params:
      model: "openai/Deepseeker Coder"
      api_base: "http://host.docker.internal:8088/v1"
      api_key: "sk-XvKFiwDoOtOe8i4lwbzb8Q"
      merge_reasoning_content_in_choices: false
    model_info:
      id: "wolinet-pro"
      mode: chat
      base_model: "Wolinet Pro"
      max_input_tokens: 32768
      max_output_tokens: 8192
      rpm: 3000
      tpm: 6000000

  - model_name: "Secure Pro"
    litellm_params:
      model: "openai/Deepseeker Coder"
      api_base: "http://host.docker.internal:8088/v1"
      api_key: "sk-XvKFiwDoOtOe8i4lwbzb8Q"
      merge_reasoning_content_in_choices: false
    model_info:
      id: "secure-pro"
      mode: chat
      base_model: "Secure Pro"
      max_input_tokens: 32768
      max_output_tokens: 8192

  - model_name: "Wolinet Turbo Draft"
    litellm_params:
      model: "openai/Deepseeker Coder"
      api_base: "http://host.docker.internal:8088/v1"
      api_key: "sk-XvKFiwDoOtOe8i4lwbzb8Q"
      merge_reasoning_content_in_choices: false
    model_info:
      id: "wolinet-turbo-draft"
      mode: chat
      base_model: "Wolinet Turbo Draft"
      max_input_tokens: 32768
      max_output_tokens: 8192

  # ============================================================================
  # TIER C: WOLINET MAX (Google Gemini Cloud Enterprise Platform - Multimodal MoE)
  # ============================================================================
  - model_name: "Wolinet Max"
    litellm_params:
      model: "gemini/gemini-3.8-flash"
      api_base: "https://aiplatform.googleapis.com/v1/projects/194835052236/locations/global/publishers/google"
      api_key: "AQ.Ab8RN6I6jDTRMgx2zJbueLK2_s7DMq6-Ec3Y4BUJuA8khozfYA"
      timeout: 90
      merge_reasoning_content_in_choices: false
      temperature: 0.3
      top_p: 0.85
    model_info:
      id: "wolinet-max"
      mode: chat
      base_model: "Wolinet Max"
      max_input_tokens: 1048576
      max_output_tokens: 65536
      rpm: 4000
      tpm: 8000000

  # Wolinet Turbo / Wolinet Max Turbo: Ultra-High Speed Generation (Sub-Second TTFT)
  - model_name: "Wolinet Turbo"
    litellm_params:
      model: "gemini/gemini-3.8-flash"
      api_base: "https://aiplatform.googleapis.com/v1/projects/194835052236/locations/global/publishers/google"
      api_key: "AQ.Ab8RN6I6jDTRMgx2zJbueLK2_s7DMq6-Ec3Y4BUJuA8khozfYA"
      timeout: 90
      merge_reasoning_content_in_choices: false
      temperature: 0.2
      top_p: 0.8
    model_info:
      id: "wolinet-turbo"
      mode: chat
      base_model: "Wolinet Turbo"
      max_input_tokens: 1048576
      max_output_tokens: 8192
      rpm: 4000
      tpm: 8000000

  # ============================================================================
  # TIER B: WOLINET MAX PRO (Moonshot Kimi K3.1 Pro MoE Cluster - 1M Context & Video)
  # ============================================================================
  # Deployment 1: Highspeed Engine (2-3x generation speed for interactive coding/chat)
  - model_name: "Wolinet Max Pro"
    litellm_params:
      model: "moonshot/kimi-k3.1-pro-highspeed"
      api_base: "https://api.moonshot.ai/v1"
      api_key: "os.environ/MOONSHOT_API_KEY"
      timeout: 90
      merge_reasoning_content_in_choices: false
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.000020
      cache_read_input_token_cost: 0.0000002
    model_info:
      id: "wolinet-max-pro"
      mode: chat
      base_model: "Wolinet Max Pro"
      max_input_tokens: 1048576
      max_output_tokens: 65536
      rpm: 2000
      tpm: 4000000

  # Deployment 2: Deep-Reasoning 1M Context Engine (Long-horizon complex reasoning)
  - model_name: "Wolinet Max Pro"
    litellm_params:
      model: "moonshot/kimi-k3.1-pro"
      api_base: "https://api.moonshot.ai/v1"
      api_key: "os.environ/MOONSHOT_API_KEY"
      timeout: 60
      merge_reasoning_content_in_choices: false
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000010
      cache_read_input_token_cost: 0.0000002
    model_info:
      id: "wolinet-max-pro-deep"
      mode: chat
      base_model: "Wolinet Max Pro"
      max_input_tokens: 1048576
      max_output_tokens: 65536
      rpm: 1000
      tpm: 2000000

  # ============================================================================
  # TIER D: SCORPIO (DeepSeek V4.1 Flash & V4 Pro - 1M Context, Vision & FIM)
  # ============================================================================
  # Deployment 1: Scorpio Flagship (DeepSeek V4.1 Flash - High-Throughput & Vision)
  - model_name: "Scorpio"
    litellm_params:
      model: "deepseek/deepseek-flash"
      api_base: "https://api.deepseek.com"
      api_key: "os.environ/DEEPSEEK_API_KEY"
      timeout: 60
      merge_reasoning_content_in_choices: false
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.000000006
    model_info:
      id: "scorpio"
      mode: chat
      base_model: "Scorpio"
      max_input_tokens: 1048576
      max_output_tokens: 393216
      rpm: 2500
      tpm: 10000000

  # Deployment 2: Scorpio Pro (DeepSeek V4 Pro - Deep Frontier Architecture)
  - model_name: "Scorpio Pro"
    litellm_params:
      model: "deepseek/deepseek-v4-pro"
      api_base: "https://api.deepseek.com"
      api_key: "os.environ/DEEPSEEK_API_KEY"
      timeout: 90
      merge_reasoning_content_in_choices: false
      input_cost_per_token: 0.00000132
      output_cost_per_token: 0.00000396
      cache_read_input_token_cost: 0.000000044
    model_info:
      id: "scorpio-pro"
      mode: chat
      base_model: "Scorpio Pro"
      max_input_tokens: 1048576
      max_output_tokens: 393216
      rpm: 500
      tpm: 5000000

  # ============================================================================
  # NATIVE MULTIMODAL SPECIALIZATION (Vision, Image, Audio)
  # ============================================================================
  # Wolinet Max: Native Multimodal Image Generation
  - model_name: "Wolinet Max Image"
    litellm_params:
      model: "gemini/gemini-3.1-flash-image"
      api_base: "https://aiplatform.googleapis.com/v1/projects/194835052236/locations/global/publishers/google"
      api_key: "AQ.Ab8RN6I6jDTRMgx2zJbueLK2_s7DMq6-Ec3Y4BUJuA8khozfYA"
    model_info:
      id: "wolinet-max-image"
      mode: image_generation

  # Wolinet Max: Native Multimodal Audio Transcription
  - model_name: "Wolinet Max Audio"
    litellm_params:
      model: "gemini/gemini-3.5-transcribe"
      api_base: "https://aiplatform.googleapis.com/v1/projects/194835052236/locations/global/publishers/google"
      api_key: "AQ.Ab8RN6I6jDTRMgx2zJbueLK2_s7DMq6-Ec3Y4BUJuA8khozfYA"
    model_info:
      id: "wolinet-max-audio"
      mode: audio_transcription

  # Wolinet AI Sovereign Voice Engine (24kHz Studio Broadcast & Natural East African Cadence)
  - model_name: "Wolinet Voice"
    litellm_params:
      model: "openai/Wolinet Voice"
      api_base: "http://127.0.0.1:8090/v1"
