general_settings:
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 20     # max PG connections from lango
  database_connection_timeout: 30        # seconds before pool acquisition fails
  forward_client_headers_to_llm_api: true
  forward_llm_provider_auth_headers: true
  master_key: os.environ/LITELLM_MASTER_KEY
  pass_through_endpoints:
  - path: /v1/images/*
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/audio/*
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/rerank
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /rerank
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/ocr
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/doc_analyze
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/videos/*
    target: os.environ/WOLINET_INFERENCE_URL
  store_model_in_db: false
  disable_env_credential_login: false
  hide_default_credentials_hint: true
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: internal_user
litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 3
  enable_anthropic_prompt_caching: false
  openai_system_messages_first: true
  websearch_interception_params:
    enabled: true
    enabled_providers:
      - bedrock
      - vertex_ai
      - openai
      - aiohttp_openai
    search_tool_name: "duckduckgo-search"
    max_agentic_loops: 3
search_tools:
  - search_tool_name: "duckduckgo-search"
    litellm_params:
      search_provider: "duckduckgo"
    search_tool_info:
      description: "Default web search provider via DuckDuckGo"
model_list:
  - model_name: wolinet-coder
    litellm_params:
      model: wolinet_ai/deepseek-coder-instruct
      api_base: os.environ/WOLINET_API_BASE
      api_key: os.environ/XINFERENCE_API_KEY
      timeout: 600
    model_info:
      id: "wolinet-coder"
      name: "Wolinet Coder"
      mode: chat
      provider: "Wolinet AI"
      litellm_provider: "wolinet_ai"
      description: "Wolinet Coder - Sovereign High-Performance AI Coding Engine"
      max_tokens: 2048
      max_input_tokens: 2048

router_settings:
  num_retries: 2
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  routing_strategy: latency-based-routing
  timeout: 600
  enable_pre_call_checks: true
  model_group_alias:
    "deepseek-coder-1.3b": "wolinet-coder"
    "deepseek-coder-instruct": "wolinet-coder"
    "deepseek-coder": "wolinet-coder"
    "wolinex-coder": "wolinet-coder"
    "wolinex-coder-pro": "wolinet-coder"
    "wolinex-coder-lite": "wolinet-coder"
    "wolinex-omni": "wolinet-coder"
