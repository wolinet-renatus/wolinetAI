general_settings:
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 60     # max PG connections from lango (increased for high concurrency)
  database_connection_timeout: 60        # seconds before pool acquisition fails
  user_api_key_cache_ttl: 300            # cache resolved API keys in memory for 5 minutes (eliminates redundant DB queries)
  forward_client_headers_to_llm_api: true
  forward_llm_provider_auth_headers: true
  master_key: os.environ/LITELLM_MASTER_KEY
  pass_through_endpoints:
  - path: /v1/rerank
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /rerank
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/ocr
    target: os.environ/WOLINET_INFERENCE_URL
  - path: /v1/doc_analyze
    target: os.environ/WOLINET_INFERENCE_URL
  store_model_in_db: true
  disable_env_credential_login: false
  hide_default_credentials_hint: true
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: internal_user

litellm_settings:
  model_alias:
    # Wolinet Pro: Default sovereign conversational flagship
    "Wolinet Pro": "Wolinet Pro"
    "wolinet-pro": "Wolinet Pro"

    # Wolinet Coder / Wolinex Coder: Sovereign code intelligence
    "Wolinet Coder": "Wolinet Coder"
    "wolinet-coder": "Wolinet Coder"
    "Wolinex Coder": "Wolinet Coder"
    "wolinex-coder": "Wolinet Coder"

    # Wolinet Turbo / Wolinet Max Turbo: Ultra-high throughput streaming flagship
    "Wolinet Turbo": "Wolinet Turbo"
    "wolinet-turbo": "Wolinet Turbo"
    "Wolinet Max Turbo": "Wolinet Turbo"
    "wolinet-max-turbo": "Wolinet Turbo"

    # Wolinet Max: Multimodal frontier heavy-duty flagship (Gemini + Local Fallback)
    "Wolinet Max": "Wolinet Max"
    "wolinet-max": "Wolinet Max"
    "gemini-cloud-preview": "Wolinet Max"
    "gemini-3.5-flash": "Wolinet Max"
    "gemini-2.5-flash": "Wolinet Max"
    "gemini-flash-latest": "Wolinet Max"
    "gemini-pro-latest": "Wolinet Max"
    "gemini/gemini-3.5-flash": "Wolinet Max"
    "gemini/gemini-2.5-flash": "Wolinet Max"
    "gpt-4o": "Wolinet Max"
    "gpt-4o-mini": "Wolinet Max"
    "gpt-4": "Wolinet Max"
    "gpt-3.5-turbo": "Wolinet Pro"
    "claude-3-5-sonnet": "Wolinet Max"
  extra_spend_tag_headers:
    - "X-OpenWebUI-User-Id"
    - "X-OpenWebUI-User-Email"
    - "X-OpenWebUI-User-Name"
  drop_params: true
  request_timeout: 600
  num_retries: 3
  enable_anthropic_prompt_caching: false
  openai_system_messages_first: true
  websearch_interception_params:
    enabled: true
    enabled_providers:
      - bedrock
      - vertex_ai
      - openai
      - aiohttp_openai
    search_tool_name: "web_search"
    max_agentic_loops: 3
  callbacks:
    - "wolinet_browser_adapter.wolinet_browser_handler"

mcp_servers:
  wolinet_browser:
    url: "http://wolinet-browser:8080/mcp"
    transport: "http"
    description: "Wolinet self-hosted Obscura browser and sovereign crawler/search index for local web searching, navigation, clean Markdown extraction, and interaction."

