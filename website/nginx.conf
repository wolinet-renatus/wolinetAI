map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

# Bridge network upstream mapping (Docker container service names vs local development)
map $host $wolinex_upstream {
    default wolinex:8080;
    localhost 127.0.0.1:8081;
    127.0.0.1 127.0.0.1:8081;
}

map $host $gateway_upstream {
    default lango:4000;
    localhost 127.0.0.1:4000;
    127.0.0.1 127.0.0.1:4000;
}

# Embedded Docker DNS resolver for bridge networks (127.0.0.11) with fallback
resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    # Listen on standard HTTP, edge reverse proxy port (8080), and dev port (3000)
    listen 80 default_server;
    listen 8080;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Direct App Releases & Binary Downloads
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    # Session & Key Management Auth Proxy (Docker Bridge: wolinex:8080)
    location /api/wolinet/ {
        proxy_pass http://$wolinex_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # High-Throughput OpenAI-Compatible Inference API (Docker Bridge: lango:4000)
    location /v1/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no always;
    }

    # Interactive API Reference (Docker Bridge: lango:4000/docs)
    location /docs {
        proxy_pass http://$gateway_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location = /openapi.json {
        proxy_pass http://$gateway_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static Assets with Cache Control
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:woff2?|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA / HTML fallback
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
