map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

upstream wolinex_service {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream gateway_service {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 3000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Session & Key Management Auth Proxy
    location /api/wolinet/ {
        proxy_pass http://wolinex_service;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # High-Throughput OpenAI-Compatible Inference API
    location /v1/ {
        proxy_pass http://gateway_service;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no always;
    }

    # Interactive API Reference (Scalar / Swagger)
    location /docs {
        proxy_pass http://gateway_service/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location = /openapi.json {
        proxy_pass http://gateway_service/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static Assets with Cache Control
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:woff2?|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA / HTML fallback
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
