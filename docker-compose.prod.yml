# ==============================================================================
# Wolinet AI production stack
# ==============================================================================
# Services:
#   postgres   → Shared PostgreSQL cluster (LiteLLM + Open WebUI)
#   redis      → Session cache / LiteLLM router coordination
#   mitambo    → Xinference inference engine  (mitambo.wolinet.com)
#   lango      → LiteLLM AI Gateway          (lango.wolinet.com)
#   wolinex    → Open WebUI (web client)     (wolinex.wolinet.com)
#   website    → Marketing / home page       (ai.wolinet.com)
#   devportal  → Developer docs and key studio (dev.wolinet.com)
#   nginx      → Reverse proxy + TLS terminator
# ==============================================================================

networks:
  default:
    driver: overlay
    attachable: true
  wolinet_internal:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:
  xinference_data:
  webui_data:

services:
  # ==========================================================================
  # 1. PostgreSQL — shared state backend for all services
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: wolinet-postgres
    restart: unless-stopped
    shm_size: "256m"
    networks:
      - wolinet_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: litellm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgres.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./scripts/db/migrations:/docker-entrypoint-initdb.d/schema:ro
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  db-init:
    image: postgres:16-alpine
    container_name: wolinet-db-init
    restart: "no"
    networks:
      - wolinet_internal
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_INIT_VERSION: "5"
    volumes:
      - ./scripts/deploy/ensure-postgres-databases.sh:/usr/local/bin/ensure-postgres-databases.sh:ro
    entrypoint: ["/usr/local/bin/ensure-postgres-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # 2. Redis — session cache + LiteLLM router coordination
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: wolinet-redis
    restart: unless-stopped
    networks:
      - wolinet_internal
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel warning
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ==========================================================================
  # 3. Xinference — Local GPU inference engine  →  mitambo.wolinet.com
  # ==========================================================================
  mitambo:
    image: xprobe/xinference:${XINFERENCE_IMAGE_TAG:-latest}
    container_name: wolinet-mitambo
    restart: unless-stopped
    networks:
      - wolinet_internal
    environment:
      XINFERENCE_HOME: /root/.xinference
      XINFERENCE_AUTH_ADVANCED: ${XINFERENCE_AUTH_ADVANCED:-true}
      XINFERENCE_ADMIN_USER: ${XINFERENCE_ADMIN_USER:-admin}
      XINFERENCE_ADMIN_PASSWORD: ${XINFERENCE_ADMIN_PASSWORD:-Woli@1211}
      XINFERENCE_API_KEY: ${XINFERENCE_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      HF_HOME: /root/.xinference/cache
      XINFERENCE_MODEL_SRC: ${XINFERENCE_MODEL_SRC:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      XINFERENCE_FRONTEND_DIST_DIR: /ui
    entrypoint: ["/usr/local/bin/start-mitambo.sh"]
    volumes:
      - xinference_data:/root/.xinference
      - ./inference/start-mitambo.sh:/usr/local/bin/start-mitambo.sh:ro
      - ./inference/xinference/ui/web/dist:/app/dist:ro
      - ./inference/frontend/out:/app/out:ro
    command: >
      xinference-local -H 0.0.0.0 -p 9997 --log-level info
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: 28G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9997/status >/dev/null 2>&1 || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9997/status', timeout=5)\" >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      start_period: 45s

  # ==========================================================================
  # 4. LiteLLM Gateway  →  lango.wolinet.com + dev.wolinet.com (portal)
  # ==========================================================================
  lango:
    image: ${LANGO_IMAGE:-ghcr.io/berriai/litellm:main-latest}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/start-gateway.sh"]
    networks:
      - wolinet_internal
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      WOLINET_GATEWAY_MASTER_KEY: ${WOLINET_GATEWAY_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-Wolinet@2026!}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}}
      LITELLM_CONFIG_PATH: /app/config.yaml
      STORE_MODEL_IN_DB: "true"
      DOCS_URL: /docs
      ROOT_REDIRECT_URL: /ui
      DOCS_TITLE: "Wolinet AI — Sovereign Gateway API Reference"
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/litellm
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      LITELLM_DISABLE_NO_REDIS_WARNING: "true"
      # Inference engine (internal bridge)
      WOLINET_API_BASE: http://mitambo:9997/v1
      WOLINET_INFERENCE_URL: http://mitambo:9997
      XINFERENCE_API_KEY: ${XINFERENCE_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      # Cloud providers
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      # Portal
      DEFAULT_MODEL: ${DEFAULT_MODEL:-wolinet-coder}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-wolinet-coder}
      WOLINET_COOKIE_DOMAIN: ".wolinet.com"
      UI_LOGO_PATH: "/app/assets/wolinet_logo.png"
      UI_LOGO_PATH_DARK: "/app/assets/wolinet_logo_dark.png"
      LITELLM_FAVICON_URL: "/app/assets/favicon.png"
    volumes:
      - ./gateway/start-gateway.sh:/usr/local/bin/start-gateway.sh:ro
      - ./gateway/config.yaml:/app/config.yaml:ro
      - ./gateway/assets:/app/assets:ro
      - ./gateway/assets/wolinet_logo.png:/app/.venv/lib/python3.13/site-packages/litellm/proxy/logo.jpg:ro
      - ./gateway/assets/wolinet_logo_dark.png:/app/.venv/lib/python3.13/site-packages/litellm/proxy/logo_dark.png:ro
      - ./gateway/assets/favicon.ico:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out/favicon.ico:ro
      - ./gateway/assets/favicon.png:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out/favicon.png:ro
      - ./gateway/litellm/proxy/swagger:/app/.venv/lib/python3.13/site-packages/litellm/proxy/swagger:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      --config /app/config.yaml --port 4000 --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "3.0"
          memory: 6G

  # ==========================================================================
  # 5. Open WebUI (Wolinex)  →  wolinex.wolinet.com
  # ==========================================================================
  wolinex:
    image: ${WOLINEX_IMAGE:-ghcr.io/open-webui/open-webui:main}
    restart: unless-stopped
    networks:
      - wolinet_internal
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      WEBUI_NAME: "Wolinet AI"
      WEBUI_URL: "https://wolinex.wolinet.com"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      # LiteLLM gateway (internal bridge — zero latency)
      OPENAI_API_BASE_URL: "http://lango:4000/v1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      WEBUI_AUTH_COOKIE_SAME_SITE: lax
      WEBUI_AUTH_COOKIE_SECURE: "True"
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      WEBUI_SESSION_COOKIE_SECURE: "True"
      WEBUI_AUTH_COOKIE_DOMAIN: ".wolinet.com"
      LITELLM_BASE_URL: "http://lango:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      ENABLE_FORWARD_USER_INFO_HEADERS: "True"
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/webui
      WEBUI_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/webui
      DATABASE_POOL_SIZE: "10"
      DATABASE_POOL_MAX_OVERFLOW: "20"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_POOL_RECYCLE: "3600"
      DATABASE_ENABLE_SESSION_SHARING: "True"
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      # Models
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: wolinex-embed
      RAG_OPENAI_API_BASE_URL: "http://lango:4000/v1"
      RAG_OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      ENABLE_RAG_HYBRID_SEARCH: "False"
      VECTOR_DB: chroma
      # Telemetry
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      CORS_ALLOW_ORIGIN: "https://wolinex.wolinet.com;https://dev.wolinet.com;https://docs.wolinet.com"
      FORWARDED_ALLOW_IPS: "*"
      DEFAULT_USER_BUDGET: "25.0"
      DEFAULT_MODELS: "wolinet-coder"
      ENABLE_MODEL_FILTER: "True"
      MODEL_FILTER_LIST: "wolinet-coder"
      OPENAI_API_CONFIGS: '{"0": {"enable": true, "model_ids": ["wolinet-coder"]}}'
    volumes:
      - webui_data:/app/backend/data
      - ./gateway/assets/wolinet_logo.png:/app/build/static/logo.png:ro
      - ./gateway/assets/wolinet_logo.png:/app/build/static/splash.png:ro
      - ./gateway/assets/wolinet_logo_dark.png:/app/build/static/splash-dark.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/favicon.png:ro
      - ./gateway/assets/favicon.ico:/app/build/static/favicon.ico:ro
      - ./gateway/assets/favicon.png:/app/build/static/favicon-96x96.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/apple-touch-icon.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/web-app-manifest-192x192.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/web-app-manifest-512x512.png:ro
      - ./gateway/assets/favicon.png:/app/build/favicon.png:ro
      - ./gateway/assets/favicon.ico:/app/build/favicon.ico:ro
      - ./gateway/assets/wolinet_logo.png:/app/build/logo.png:ro
      - ./gateway/assets/wolinet_logo.png:/app/build/splash.png:ro
      - ./gateway/assets/wolinet_logo_dark.png:/app/build/splash-dark.png:ro
    depends_on:
      postgres:
        condition: service_healthy
      lango:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 5G

  # ==========================================================================
  # 6. Marketing Website  →  ai.wolinet.com
  # ==========================================================================
  website:
    image: ${WEBSITE_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        mkdir -p /usr/share/nginx/html
        if [ -d /app/website ] && [ -f /app/website/index.html ]; then
          cp -r /app/website/. /usr/share/nginx/html/
        fi
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            location / {
                try_files $$uri $$uri/ /index.html =404;
            }
        }
        EOF
        chmod -R a+rX /usr/share/nginx/html
        exec nginx -g 'daemon off;'
    volumes:
      - ./website:/app/website:ro
    networks:
      - wolinet_internal
    expose: ["80", "8080"]
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ==========================================================================
  # 7. Nginx — reverse proxy + TLS termination for all 5 subdomains
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: wolinet-nginx
    restart: unless-stopped
    networks:
      - wolinet_internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - ./nginx/secrets/mitambo.htpasswd:/etc/nginx/secrets/mitambo.htpasswd:ro
    depends_on:
      - website
      - wolinex
      - lango
      - mitambo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nginx -t && wget -qO- http://localhost/nginx-health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

