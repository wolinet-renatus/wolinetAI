# ==============================================================================
# Wolinet AI — Production Docker Compose (Single Contabo GPU Server)
# ==============================================================================
# Services:
#   postgres   → Shared PostgreSQL cluster (LiteLLM + Open WebUI)
#   redis      → Session cache / LiteLLM router coordination
#   mitambo    → Xinference inference engine  (mitambo.wolinet.com)
#   lango      → LiteLLM AI Gateway          (lango.wolinet.com)
#   wolinex    → Open WebUI (web client)     (wolinex.wolinet.com)
#   website    → Marketing / home page       (ai.wolinet.com)
#   devportal  → Developer portal            (dev.wolinet.com — served by lango)
#   nginx      → Reverse proxy + TLS terminator
# ==============================================================================

version: "3.9"

networks:
  wolinet_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  xinference_data:
  webui_data:
  website_data:

services:

  # ==========================================================================
  # 1. PostgreSQL — shared state backend for all services
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: wolinet-postgres
    restart: unless-stopped
    shm_size: "256m"
    networks:
      - wolinet_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wolinet_pg_secret_change_me}
      POSTGRES_DB: litellm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgres.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    ports:
      - "5432:5432"
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # 2. Redis — session cache + LiteLLM router coordination
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: wolinet-redis
    restart: unless-stopped
    networks:
      - wolinet_internal
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-wolinet_redis_secret_change_me}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-wolinet_redis_secret_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ==========================================================================
  # 3. Xinference — Local GPU inference engine  →  mitambo.wolinet.com
  # ==========================================================================
  mitambo:
    image: xprobe/xinference:latest
    container_name: wolinet-mitambo
    restart: unless-stopped
    networks:
      - wolinet_internal
    ports:
      - "9997:9997"
    environment:
      XINFERENCE_HOME: /root/.xinference
      XINFERENCE_AUTH_ADVANCED: "false"
      HF_ENDPOINT: "https://hf-mirror.com"
    volumes:
      - ./models:/models
      - xinference_data:/root/.xinference
    command: >
      xinference-local -H 0.0.0.0 -p 9997
    # ── Uncomment on NVIDIA GPU server ─────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 28G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9997/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # 4. LiteLLM Gateway  →  lango.wolinet.com + dev.wolinet.com (portal)
  # ==========================================================================
  lango:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: wolinet-lango
    restart: unless-stopped
    networks:
      - wolinet_internal
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-wolinet-master-key-change-me}
      WOLINET_GATEWAY_MASTER_KEY: ${WOLINET_GATEWAY_MASTER_KEY:-sk-wolinet-master-key-change-me}
      LITELLM_CONFIG_PATH: /app/config.yaml
      STORE_MODEL_IN_DB: "true"
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-wolinet_pg_secret_change_me}@postgres:5432/litellm
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wolinet_redis_secret_change_me}
      REDIS_URL: redis://:${REDIS_PASSWORD:-wolinet_redis_secret_change_me}@redis:6379
      LITELLM_DISABLE_NO_REDIS_WARNING: "true"
      # Inference engine (internal bridge)
      WOLINET_API_BASE: http://mitambo:9997/v1
      WOLINET_INFERENCE_URL: http://mitambo:9997
      WOLINET_API_KEY: not-needed
      # Cloud providers
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Portal
      DEFAULT_MODEL: ${DEFAULT_MODEL:-wolinex-coder}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-wolinex-coder}
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      --config /app/config.yaml --port 4000 --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ==========================================================================
  # 5. Open WebUI (Wolinex)  →  wolinex.wolinet.com
  # ==========================================================================
  wolinex:
    build:
      context: ./apps/web-client
      dockerfile: Dockerfile
    image: wolinet/wolinex:latest
    container_name: wolinet-wolinex
    restart: unless-stopped
    networks:
      - wolinet_internal
    ports:
      - "3080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      WEBUI_NAME: "Wolinet AI"
      WEBUI_URL: "https://wolinex.wolinet.com"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-wolinet-sovereign-master-secret-2026}
      # LiteLLM gateway (internal bridge — zero latency)
      OPENAI_API_BASE_URL: "http://lango:4000/v1"
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-wolinet-master-key-change-me}
      LITELLM_BASE_URL: "http://lango:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-wolinet-master-key-change-me}
      ENABLE_FORWARD_USER_INFO_HEADERS: "True"
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-wolinet_pg_secret_change_me}@postgres:5432/webui
      WEBUI_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-wolinet_pg_secret_change_me}@postgres:5432/webui
      DATABASE_POOL_SIZE: "10"
      DATABASE_POOL_MAX_OVERFLOW: "20"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_POOL_RECYCLE: "3600"
      DATABASE_ENABLE_SESSION_SHARING: "True"
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-wolinet_redis_secret_change_me}@redis:6379
      # Models
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: wolinex-embed
      RAG_OPENAI_API_BASE_URL: "http://lango:4000/v1"
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-wolinet-master-key-change-me}
      ENABLE_RAG_HYBRID_SEARCH: "False"
      VECTOR_DB: chroma
      # Telemetry
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      CORS_ALLOW_ORIGIN: "*"
      FORWARDED_ALLOW_IPS: "*"
      DEFAULT_USER_BUDGET: "25.0"
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      lango:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================================================
  # 6. Marketing Website  →  ai.wolinet.com
  # ==========================================================================
  website:
    image: nginx:alpine
    container_name: wolinet-website
    restart: unless-stopped
    networks:
      - wolinet_internal
    ports:
      - "8000:80"
    volumes:
      - website_data:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # 7. Nginx — reverse proxy + TLS termination for all 5 subdomains
  # ==========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: wolinet-nginx
    restart: unless-stopped
    networks:
      - wolinet_internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
    depends_on:
      - website
      - wolinex
      - lango
      - mitambo
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
