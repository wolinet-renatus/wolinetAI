# ==============================================================================
# Wolinet AI - Self-Hosted Enterprise Docker Compose
# Production stack for Dokploy and self-hosted environments.
# CPU-safe defaults; add docker-compose.gpu.yml on NVIDIA hosts.
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: litellm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgres.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    networks: [wolinet_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-4G}

  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - ./scripts/deploy/ensure-postgres-databases.sh:/usr/local/bin/ensure-postgres-databases.sh:ro
    networks: [wolinet_internal]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/ensure-postgres-databases.sh"]

  mitambo:
    image: ${XINFERENCE_CPU_IMAGE:-xprobe/xinference:v3.0.0-cpu}
    restart: unless-stopped
    shm_size: ${XINFERENCE_SHM_SIZE:-2gb}
    environment:
      XINFERENCE_HOME: /root/.xinference
      XINFERENCE_AUTH_DB_PATH: /root/.xinference/auth/auth.db
      XINFERENCE_MODEL_SRC: modelscope
      # Xinference v3 authentication stays enabled by default.
    volumes:
      - xinference_data:/root/.xinference
      - ./models:/models:ro
    networks: [wolinet_internal]
    expose: ["9997"]
    command: ["xinference-local", "-H", "0.0.0.0", "-p", "9997", "--log-level", "info"]
    healthcheck:
      # /status is checked by scripts/deploy/verify-stack.sh with the API key.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9997/status', timeout=5)\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: ${XINFERENCE_CPU_LIMIT:-8.0}
          memory: ${XINFERENCE_MEMORY_LIMIT:-24G}

  lango:
    image: ghcr.io/berriai/litellm:v1.74.0-stable
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in Dokploy}
      WOLINET_GATEWAY_MASTER_KEY: ${WOLINET_GATEWAY_MASTER_KEY:?Set WOLINET_GATEWAY_MASTER_KEY in Dokploy}
      LITELLM_CONFIG_PATH: /app/config.yaml
      DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL in Dokploy}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WOLINET_API_BASE: http://mitambo:9997/v1
      WOLINET_INFERENCE_URL: http://mitambo:9997
      XINFERENCE_API_KEY: ${XINFERENCE_API_KEY:-bootstrap-pending}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5-instruct}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-qwen2.5-instruct}
      STORE_MODEL_IN_DB: "true"
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    networks: [wolinet_internal]
    expose: ["4000"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mitambo:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=5)\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${LITELLM_CPU_LIMIT:-2.0}
          memory: ${LITELLM_MEMORY_LIMIT:-4G}
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: start-first

  # The developer portal is served by the existing LiteLLM portal routes at
  # dev.wolinet.com; a second LiteLLM container would duplicate state and keys.
  wolinex:
    build:
      context: ./apps/web-client
      dockerfile: Dockerfile
    image: wolinet/wolinex:${WOLINEX_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      WEBUI_NAME: Wolinet AI
      WEBUI_URL: https://wolinex.wolinet.com
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in Dokploy}
      OPENAI_API_BASE_URL: http://lango:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_BASE_URL: http://lango:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: ${WEBUI_DATABASE_URL:?Set WEBUI_DATABASE_URL in Dokploy}
      WEBUI_DATABASE_URL: ${WEBUI_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: wolinex-embed
      RAG_OPENAI_API_BASE_URL: http://lango:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      DEFAULT_USER_BUDGET: "25.0"
    volumes:
      - webui_data:/app/backend/data
    networks: [wolinet_internal]
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      lango:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: ${WOLINEX_CPU_LIMIT:-2.0}
          memory: ${WOLINEX_MEMORY_LIMIT:-4G}
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: start-first

  # The existing web-home image is a static nginx server; publish it only via
  # Dokploy's domain router. Mount the site's built files at ./website.
  website:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
    networks: [wolinet_internal]
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${WEBSITE_CPU_LIMIT:-1.0}
          memory: ${WEBSITE_MEMORY_LIMIT:-512M}
      update_config:
        parallelism: 1
        delay: 5s
        monitor: 30s
        failure_action: rollback
        order: start-first

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    volumes:
      - redis_data:/data
    networks: [wolinet_internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1.0}
          memory: ${REDIS_MEMORY_LIMIT:-512M}

networks:
  wolinet_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  xinference_data:
  webui_data:
