# ==============================================================================
# Wolinet AI - Self-Hosted Enterprise Docker Compose
# Production stack for Dokploy and self-hosted environments.
# CPU-safe defaults; add docker-compose.gpu.yml on NVIDIA hosts.
# Swarm/Stack compatible: no depends_on conditions, overlay network,
# restart_policy under deploy, no shm_size (unsupported in stack mode).
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: litellm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-postgres.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    command: ["postgres", "-c", "tcp_keepalives_idle=60", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=5"]
    networks:
      - default
      - wolinet_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-4G}

  db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      DB_INIT_VERSION: "5"
    volumes:
      - ./scripts/deploy/ensure-postgres-databases.sh:/usr/local/bin/ensure-postgres-databases.sh:ro
    networks:
      - default
      - wolinet_internal
    entrypoint: ["/usr/local/bin/ensure-postgres-databases.sh"]
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 5s

  mitambo:
    image: ${MITAMBO_IMAGE:-ghcr.io/wolinet-renatus/wolinet-mitambo-cpu:latest}
    environment:
      XINFERENCE_HOME: /root/.xinference
      XINFERENCE_AUTH_DB_PATH: /root/.xinference/auth/auth.db
      XINFERENCE_MODEL_SRC: modelscope
      XINFERENCE_ENABLE_VIRTUAL_ENV: "0"
      XINFERENCE_AUTH_ADVANCED: ${XINFERENCE_AUTH_ADVANCED:-true}
      XINFERENCE_ADMIN_USER: ${XINFERENCE_ADMIN_USER:-admin}
      XINFERENCE_ADMIN_PASSWORD: ${XINFERENCE_ADMIN_PASSWORD:-Woli@1211}
      XINFERENCE_API_KEY: ${XINFERENCE_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      XINFERENCE_FRONTEND_DIST_DIR: /ui
    entrypoint: ["/usr/local/bin/start-mitambo.sh"]
    volumes:
      - xinference_data:/root/.xinference
      - ./models:/models:ro
      - ./inference/start-mitambo.sh:/usr/local/bin/start-mitambo.sh:ro
      - ./inference/xinference/ui/web/dist:/app/dist:ro
      - ./inference/frontend/out:/app/out:ro
    networks:
      default:
        aliases:
          - mitambo
          - wolinet-mitambo
      wolinet_internal:
        aliases:
          - mitambo
          - wolinet-mitambo
    ports:
      - "9997:9997"
    expose: ["9997"]
    command: ["xinference-local", "-H", "0.0.0.0", "-p", "9997", "--log-level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9997/status >/dev/null 2>&1 || python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9997/status', timeout=5)\" >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9997/status', timeout=5)\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      restart_policy:
        condition: any
        delay: 20s
        max_attempts: 0
        window: 300s
      resources:
        limits:
          cpus: ${XINFERENCE_CPU_LIMIT:-4.0}
          memory: ${XINFERENCE_MEMORY_LIMIT:-8G}

  lango:
    image: ${LANGO_IMAGE:-ghcr.io/wolinet-renatus/wolinet-lango:latest}
    entrypoint: ["/usr/local/bin/start-gateway.sh"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      WOLINET_GATEWAY_MASTER_KEY: ${WOLINET_GATEWAY_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-Wolinet@2026!}
      LITELLM_CONFIG_PATH: /app/config.yaml
      DATABASE_URL: ${LITELLM_DATABASE_URL:?Set LITELLM_DATABASE_URL in Dokploy}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LAGO_API_BASE: ${LAGO_API_BASE:-https://api.getlago.com}
      LAGO_API_KEY: ${LAGO_API_KEY:-}
      LAGO_API_EVENT_CODE: ${LAGO_API_EVENT_CODE:-openai_tokens}
      LAGO_API_CHARGE_BY: ${LAGO_API_CHARGE_BY:-team_id}
      WOLINET_FALLBACK_MODELS: ${WOLINET_FALLBACK_MODELS:-}
      WOLINET_API_BASE: http://mitambo:9997/v1
      WOLINET_INFERENCE_URL: http://mitambo:9997
      XINFERENCE_API_KEY: ${XINFERENCE_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      XAI_API_KEY: ${XAI_API_KEY:-}
      STORE_MODEL_IN_DB: "true"
      DOCS_URL: /docs
      ROOT_REDIRECT_URL: /ui
      DOCS_TITLE: "Wolinet AI — Sovereign Gateway API Reference"
      UI_LOGO_PATH: "/app/assets/wolinet_logo.png"
      UI_LOGO_PATH_DARK: "/app/assets/wolinet_logo_dark.png"
      LITELLM_FAVICON_URL: "/app/assets/favicon.png"
    volumes:
      - ./gateway/start-gateway.sh:/usr/local/bin/start-gateway.sh:ro
      - ./gateway/config.yaml:/app/config.yaml:ro
      - ./gateway/assets:/app/assets:ro
      - ./gateway/assets/wolinet_logo.png:/app/.venv/lib/python3.13/site-packages/litellm/proxy/logo.jpg:ro
      - ./gateway/assets/wolinet_logo_dark.png:/app/.venv/lib/python3.13/site-packages/litellm/proxy/logo_dark.png:ro
      - ./gateway/assets/favicon.ico:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out/favicon.ico:ro
      - ./gateway/assets/favicon.png:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out/favicon.png:ro
      - ./gateway/litellm/proxy/swagger:/app/.venv/lib/python3.13/site-packages/litellm/proxy/swagger:ro
    networks:
      default:
        aliases:
          - lango
          - wolinet-lango
      wolinet_internal:
        aliases:
          - lango
          - wolinet-lango
    expose: ["4000"]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      # /health requires auth; /health/liveliness is unauthenticated
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\" >/dev/null 2>&1"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 60s
    deploy:
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 0
        window: 300s
      resources:
        limits:
          cpus: ${LITELLM_CPU_LIMIT:-2.0}
          memory: ${LITELLM_MEMORY_LIMIT:-4G}
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: start-first

  # The developer portal is served by the existing LiteLLM portal routes at
  # dev.wolinet.com; a second LiteLLM container would duplicate state and keys.
  wolinex:
    image: ${WOLINEX_IMAGE:-ghcr.io/wolinet-renatus/wolinet-wolinex:latest}
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      WEBUI_NAME: ${WEBUI_NAME:-Wolinet AI}
      WEBUI_URL: ${WEBUI_URL:-https://wolinex.wolinet.com}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in Dokploy}
      OPENAI_API_BASE_URL: http://lango:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      LITELLM_BASE_URL: http://lango:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      DATABASE_URL: ${WEBUI_DATABASE_URL:?Set WEBUI_DATABASE_URL in Dokploy}
      WEBUI_DATABASE_URL: ${WEBUI_DATABASE_URL:?Set WEBUI_DATABASE_URL in Dokploy}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENABLE_OLLAMA_API: "False"
      OLLAMA_BASE_URL: ""
      OLLAMA_BASE_URLS: ""
      ENABLE_OPENAI_API: "True"
      DEFAULT_MODELS: ${DEFAULT_MODELS:-Wolinet Coder}
      BYPASS_MODEL_ACCESS_CONTROL: "True"
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://lango:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      DEFAULT_USER_BUDGET: "25.0"
    volumes:
      - webui_data:/app/backend/data
      - ./gateway/assets/wolinet_logo.png:/app/build/static/logo.png:ro
      - ./gateway/assets/wolinet_logo.png:/app/build/static/splash.png:ro
      - ./gateway/assets/wolinet_logo_dark.png:/app/build/static/splash-dark.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/favicon.png:ro
      - ./gateway/assets/favicon.ico:/app/build/static/favicon.ico:ro
      - ./gateway/assets/favicon.png:/app/build/static/favicon-96x96.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/apple-touch-icon.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/web-app-manifest-192x192.png:ro
      - ./gateway/assets/favicon.png:/app/build/static/web-app-manifest-512x512.png:ro
      - ./gateway/assets/favicon.png:/app/build/favicon.png:ro
      - ./gateway/assets/favicon.ico:/app/build/favicon.ico:ro
      - ./gateway/assets/wolinet_logo.png:/app/build/logo.png:ro
      - ./gateway/assets/wolinet_logo.png:/app/build/splash.png:ro
      - ./gateway/assets/wolinet_logo_dark.png:/app/build/splash-dark.png:ro
    networks:
      default:
        aliases:
          - wolinex
          - wolinet-wolinex
      wolinet_internal:
        aliases:
          - wolinex
          - wolinet-wolinex
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    deploy:
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 0
        window: 300s
      resources:
        limits:
          cpus: ${WOLINEX_CPU_LIMIT:-2.0}
          memory: ${WOLINEX_MEMORY_LIMIT:-4G}
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: start-first

  model-sync:
    image: ${LANGO_IMAGE:-ghcr.io/wolinet-renatus/wolinet-lango:latest}
    entrypoint: ["python3", "/usr/local/bin/sync_xinference_models.py", "--watch"]
    environment:
      LITELLM_BASE_URL: http://lango:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      XINFERENCE_BASE_URL: ${XINFERENCE_BASE_URL:-http://mitambo:9997}
      XINFERENCE_FALLBACK_URLS: ${XINFERENCE_FALLBACK_URLS:-}
      XINFERENCE_DEFAULT_MODEL_UID: ${XINFERENCE_DEFAULT_MODEL_UID:-}
      XINFERENCE_API_KEY: ${XINFERENCE_API_KEY:-sk-XvKFiwDoOtOe8i4lwbzb8Q}
      XINFERENCE_MODEL_SYNC_INTERVAL: ${XINFERENCE_MODEL_SYNC_INTERVAL:-30}
    volumes:
      - ./scripts/deploy/sync_xinference_models.py:/usr/local/bin/sync_xinference_models.py:ro
    networks:
      - default
      - wolinet_internal
    depends_on:
      - lango
      - mitambo
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s

  # The existing web-home image is a static nginx server; publish it only via
  # Dokploy's domain router. Mount the site's built files at ./website.
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/wolinet-renatus/wolinet-homepage:latest}
    restart: unless-stopped
    networks:
      default:
        aliases:
          - website
          - wolinet-website
      wolinet_internal:
        aliases:
          - website
          - wolinet-website
    expose: ["80", "8080"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`ai.wolinet.com`)"
      - "traefik.http.routers.website.entrypoints=web,websecure"
      - "traefik.http.routers.website.tls=true"
      - "traefik.http.services.website.loadbalancer.server.port=80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.website.rule=Host(`ai.wolinet.com`)"
        - "traefik.http.routers.website.entrypoints=web,websecure"
        - "traefik.http.routers.website.tls=true"
        - "traefik.http.services.website.loadbalancer.server.port=80"
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        limits:
          cpus: ${WEBSITE_CPU_LIMIT:-1.0}
          memory: ${WEBSITE_MEMORY_LIMIT:-512M}
      update_config:
        parallelism: 1
        delay: 5s
        monitor: 30s
        failure_action: rollback
        order: start-first
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    volumes:
      - redis_data:/data
    networks:
      - default
      - wolinet_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1.0}
          memory: ${REDIS_MEMORY_LIMIT:-512M}

networks:
  default:
    driver: bridge
  wolinet_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  xinference_data:
  webui_data:
