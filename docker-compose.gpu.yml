services:
  mitambo:
    image: ${MITAMBO_IMAGE:-ghcr.io/wolinet-renatus/wolinet-mitambo:latest}
    build:
      context: ./inference
      dockerfile: xinference/deploy/docker/Dockerfile
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: ${XINFERENCE_GPU_SHM_SIZE:-8gb}
    deploy:
      resources:
        limits:
          cpus: ${XINFERENCE_GPU_CPU_LIMIT:-16.0}
          memory: ${XINFERENCE_GPU_MEMORY_LIMIT:-28G}
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
