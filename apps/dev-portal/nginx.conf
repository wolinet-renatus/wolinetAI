map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    set $webui_upstream wolinex:8080;
    set $lango_upstream lango:4000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/wolinet/ {
        proxy_pass http://$webui_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        proxy_pass http://$lango_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no always;
    }

    # Interactive API docs from LiteLLM Scalar
    location /docs {
        proxy_pass http://$lango_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header Host lango.wolinet.com;
        proxy_buffering off;
    }

    location = /openapi.json {
        proxy_pass http://$lango_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host lango.wolinet.com;
    }

    # Cache static assets (CSS, JS, fonts, images) with long-term cache
    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML files: always revalidate so deployments update instantly
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
