map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    listen 8083 default_server;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $lango_upstream lango:4000;
    set $wolinex_upstream wolinex:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy OpenAPI JSON schema from sovereign gateway
    location = /openapi.json {
        proxy_pass http://$lango_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Session info from Wolinex SSO
    location /api/wolinet/ {
        proxy_pass http://$wolinex_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # API Proxy for Live Endpoint Testing & Assistant completions
    location /v1/ {
        proxy_pass http://$lango_upstream;
        proxy_http_version 1.1;
        proxy_socket_keepalive on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no always;
    }

    # Cache static assets
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:woff2?|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML index fallback
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

